<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Token Demo</title>
    <link rel="stylesheet" href="integration-demo.css" />
  </head>
  <body>
    <main class="layout">
      <section class="card" data-theme="light">
        <h2>Light Theme</h2>
        <p>Clean surfaces with a crisp primary.</p>
        <button class="btn">Start</button>
      </section>
      <section class="card" data-theme="dark">
        <h2>Dark Theme</h2>
        <p>High contrast for nighttime focus.</p>
        <button class="btn">Confirm</button>
      </section>
      <section class="card" data-theme="sunset">
        <h2>Sunset Theme</h2>
        <p>Warm palette for landing pages.</p>
        <button class="btn">Book now</button>
      </section>
    </main>
  </body>
</html>
