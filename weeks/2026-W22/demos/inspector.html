<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design Token Inspector</title>
    <style>
      :root {
        color: #172033;
        background: #f6f7f9;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      header {
        align-items: center;
        background: #ffffff;
        border-bottom: 1px solid #d9dee7;
        display: flex;
        gap: 1rem;
        justify-content: space-between;
        padding: 1rem clamp(1rem, 4vw, 2rem);
      }

      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }

      h1 {
        font-size: 1.25rem;
      }

      h2 {
        font-size: 1.4rem;
      }

      h3 {
        font-size: 1rem;
      }

      h4 {
        color: #566174;
        font-size: 0.85rem;
        margin: 0 0 0.5rem;
      }

      select {
        border: 1px solid #aeb7c7;
        border-radius: 6px;
        color: #172033;
        font: inherit;
        padding: 0.45rem 0.65rem;
      }

      main {
        display: grid;
        gap: 1rem;
        margin: 0 auto;
        max-width: 1180px;
        padding: 1rem;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        display: grid;
        gap: 0.9rem;
        padding: 1rem;
      }

      .summary {
        align-items: center;
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .eyebrow,
      .muted,
      small {
        color: #667085;
      }

      .eyebrow {
        font-size: 0.75rem;
        text-transform: uppercase;
      }

      dl {
        display: grid;
        gap: 0.5rem;
        grid-template-columns: repeat(3, 5rem);
        margin: 0;
      }

      dl div {
        border: 1px solid #d9dee7;
        border-radius: 6px;
        padding: 0.5rem;
        text-align: center;
      }

      dt {
        color: #667085;
        font-size: 0.72rem;
      }

      dd {
        font-size: 1.2rem;
        font-weight: 700;
        margin: 0;
      }

      .swatch-grid,
      .contrast-grid {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }

      .swatch-card,
      .contrast-card,
      .sample,
      .issue {
        border: 1px solid #d9dee7;
        border-radius: 8px;
        display: grid;
        gap: 0.35rem;
        min-width: 0;
        padding: 0.75rem;
      }

      .swatch {
        aspect-ratio: 3 / 2;
        background: var(--swatch);
        border: 1px solid #c7ceda;
        border-radius: 6px;
      }

      .stack {
        display: grid;
        gap: 0.7rem;
      }

      .ramps {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      .ramps > h3 {
        grid-column: 1 / -1;
      }

      .ramp-row,
      .radius-row {
        align-items: center;
        display: grid;
        gap: 0.75rem;
        grid-template-columns: minmax(0, 1fr) 7rem 4rem;
        min-height: 2rem;
      }

      .ramp-row i,
      .radius-row i {
        background: #225ea8;
        display: block;
        height: 1rem;
      }

      .radius-row i {
        height: 1.8rem;
        width: 3rem;
      }

      code {
        color: #475467;
        font-size: 0.8rem;
      }

      .contrast-preview {
        align-items: center;
        border: 1px solid #c7ceda;
        border-radius: 6px;
        display: flex;
        font-size: 2rem;
        font-weight: 700;
        height: 5rem;
        justify-content: center;
      }

      .contrast-card.pass {
        border-color: #5b9d71;
      }

      .contrast-card.warning,
      .issue.warning {
        border-color: #d69a2d;
      }

      .contrast-card.fail,
      .issue.fail {
        border-color: #d04f4f;
      }

      @media (max-width: 680px) {
        header,
        .summary {
          align-items: stretch;
          grid-template-columns: 1fr;
        }

        header {
          display: grid;
        }

        dl {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Design Token Inspector</h1>
      <select id="fixture" aria-label="Token fixture">
        <option value="/demos/clean-tokens.json">Clean tokens</option>
        <option value="/demos/problematic-tokens.json">Problematic tokens</option>
      </select>
    </header>
    <main id="inspector"></main>
    <script type="module" src="/src/browser-demo.ts"></script>
  </body>
</html>
